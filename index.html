  <style>

w:0 18px 40px rgba(15,23,42,.2);font-weight:900;z-index:50;display:none}.message.error{background:var(--red)}

    /* 極簡版 */
    .panel{padding:18px;border-radius:20px}
    .top{margin-bottom:14px}
    h1{font-size:20px}.version-badge{display:inline-block;margin-left:8px;padding:3px 7px;border-radius:999px;background:#f1f5f9;color:#64748b;font-size:11px;font-weight:900;vertical-align:middle}

    .actions{gap:8px}
    .btn{padding:10px 13px;border-radius:12px}

    @media(max-width:900px){
      body{overflow-x:hidden}
      .wrap{width:100%;max-width:100%;padding:10px}

      .brand{min-width:0}
      h1{font-size:18px;line-height:1.2}
      .actions{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

      .section,.section:last-child{width:100%;max-width:100%;min-width:0;box-sizing:border-box;border-right:0;border-bottom:1px solid var(--line);padding:12px}

      .sec-title{font-size:12px;margin-bottom:8px}
      .grid2{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}

      .grid2 .btn.small{width:100%;min-width:0;padding:10px 2px;font-size:13px;white-space:nowrap}
      .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;min-width:0}
      .field,.num,.text-input,.select{min-width:0;width:100%}
      .num button{width:34px;flex:0 0 34px}
      .seg{width:100%;min-width:0}
      .teacher-box{width:100%;max-width:100%;min-width:0}
      .teacher-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;min-width:0}
      .addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;width:100%;min-width:0}
      .addrow .text-input{min-width:0;width:100%}
      .school-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;min-width:0}
      .student-grid{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10px;row-gap:6px}.student{padding:9px 8px;min-height:46px}.student-main{gap:8px}.no{width:18px;flex:0 0 18px;font-size:10px}.student-name{font-size:16px;letter-spacing:.01em}.tag{font-size:8px;padding:2px 5px}.student-actions{gap:2px}.iconbtn{width:26px;height:26px}
      .paper{padding:24px}
      .seat-title h2{font-size:28px;padding-inline:20px}
      .meta{font-size:13px;flex-direction:column;gap:8px}
    }
    @media(max-width:430px){
      .wrap{padding:8px}
      .panel{padding:12px;border-radius:18px}
      .logo-img{width:42px;height:42px}
      h1{font-size:17px}
      .actions .btn{font-size:12px}
      .grid2 .btn.small{font-size:12px}
      .text-input,.select{padding:9px 8px}
      .student-grid{column-gap:8px;row-gap:4px}
      .student{padding:8px 6px;min-height:42px}
      .student-main{gap:6px}
      .student-name{font-size:14px;letter-spacing:0}
      .tag{font-size:8px;padding:1px 4px}
      .iconbtn{width:24px;height:24px;border-radius:8px}
    }
    
    @media(max-width:640px) and (orientation:portrait){
      .seat-paper{
        --seat-scale:.62;
        transform:scale(var(--seat-scale));
        transform-origin:top left;
        width:calc(100% / var(--seat-scale));
        margin-right:calc((100% / var(--seat-scale) - 100%) * -1);
        margin-bottom:calc((100% / var(--seat-scale) - 100%) * -1);
      }
      .seat-paper .coord{display:none!important}
      .seat-paper .delete-seat{
        width:20px;
        height:20px;
        right:-6px;
        top:-6px;
        font-size:12px;
      }
      .seat-paper .seat input{
        font-size:clamp(15px,2vw,26px)!important;
        letter-spacing:-0.04em!important;
        padding:0 3px!important;
        transform:scale(.94);
        transform-origin:center;
      }
    }

    @media(max-width:430px) and (orientation:portrait){
      .seat-paper{--seat-scale:.58}
    }

    @media(max-width:640px){
      .seat.inactive .plus{
        font-size:20px;
        line-height:1;
        color:#94a3b8;
      }
    }

    @media print{
      .seat.inactive .plus{display:none!important}
    }

    @media print{
      @page{size:A4;margin:8mm} body{background:#fff}.wrap{max-width:none;padding:0}.panel,.message,.no-print,.delete-seat,.coord,.student-actions{display:none!important}.paper{box-shadow:none;border:0;border-radius:0;padding:0;margin:0;overflow:visible;page-break-after:always}.paper:last-child{page-break-after:auto}.seat{break-inside:avoid;box-shadow:none}.student{break-inside:avoid}.student:hover{background:transparent}.student-grid{grid-template-columns:repeat(3,1fr);column-gap:32px}.seat-grid{gap:10px}

      .seat input.blue,.blue{color:#3b82f6!important;-webkit-text-fill-color:#3b82f6!important}
      .school-xiushan{background:#f0fdf4!important}.school-xiulang{background:#fefce8!important}
      .seat-title{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:16px!important;text-align:left!important;margin:0 0 22px!important}
      .seat-title h2{font-size:28px!important;letter-spacing:.12em!important;margin:0!important;padding:0 18px 4px!important;border-bottom:4px solid #111827!important;white-space:nowrap!important}
      .seat-title .meta{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:18px!important;margin:0!important;padding:0!important;border-top:0!important;max-width:none!important;font-size:13px!important;color:#475569!important;white-space:nowrap!important}
      *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
    }

<script>
(function(){
  const $ = id => document.getElementById(id);
  const STORE_KEY = 'seatToolDirectOpenStateV1';
  let state = {
    rows:6, cols:7, seats:{}, activeSeats:{}, editMode:'layout', studentList:[],
    teacherConfig:{ enabled:true, row:0, col:2, rowSpan:1, colSpan:3, label:'老師' }
  };
  let selectedStudentName = '';

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function safeNum(value, fallback, min){ const n=parseInt(value,10); return Number.isFinite(n) ? Math.max(min,n) : fallback; }
  function key(r,c){ return r+'-'+c; }
  function showMessage(text,type){ const el=$('message'); el.textContent=text; el.className='message'+(type==='error'?' error':''); el.style.display='block'; clearTimeout(showMessage.t); showMessage.t=setTimeout(()=>el.style.display='none',2500); }
  function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
  function load(){ try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ state = {...state, ...JSON.parse(raw)}; } }catch(e){} }
  function ensureGrid(){
    state.rows = safeNum(state.rows,6,1); state.cols=safeNum(state.cols,7,1);
    for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
      const k=key(r,c); if(state.activeSeats[k] === undefined) state.activeSeats[k]=true; if(state.seats[k] === undefined) state.seats[k]='';
    }
  }
  function isInsideTeacherArea(r,c){ const t=state.teacherConfig; if(!t.enabled) return false; return r>=safeNum(t.row,0,0)&&r<safeNum(t.row,0,0)+safeNum(t.rowSpan,1,1)&&c>=safeNum(t.col,0,0)&&c<safeNum(t.col,0,0)+safeNum(t.colSpan,1,1); }
  function isTeacherStart(r,c){ const t=state.teacherConfig; return t.enabled && r===safeNum(t.row,0,0) && c===safeNum(t.col,0,0); }
  function studentStyle(name){ const st=state.studentList.find(s => s.name === String(name||'').trim()); if(!st) return {text:'', bg:''}; return { text: st.gender==='女'?'pink':'blue', bg: st.school==='秀山'?'school-xiushan':(st.school==='秀朗'?'school-xiulang':'') }; }
  function togglePickStudent(name){ selectedStudentName = selectedStudentName===name ? '' : name; render(); if(selectedStudentName) showMessage('已選 '+name+'，請點座位'); }
  function assignStudentToSeat(name,k){
    if(!name || !k) return;
    Object.keys(state.seats).forEach(sk=>{ if(state.seats[sk]===name) state.seats[sk]=''; });
    state.seats[k]=name; selectedStudentName=''; state.editMode='content'; save(); render(); showMessage('已安排 '+name);
  }
  function renderControls(){
    $('rows').value=state.rows; $('cols').value=state.cols;
    $('layoutMode').classList.toggle('active',state.editMode==='layout'); $('contentMode').classList.toggle('active',state.editMode==='content');
    const t=state.teacherConfig; $('teacherEnabled').checked=!!t.enabled; $('teacherRow').value=t.row; $('teacherCol').value=t.col; $('teacherRowSpan').value=t.rowSpan; $('teacherColSpan').value=t.colSpan;
  }
  function renderSeats(){
    ensureGrid(); const grid=$('seatGrid'); grid.style.gridTemplateColumns=`repeat(${state.cols}, minmax(0, 1fr))`; grid.innerHTML='';
    for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){

      seat.addEventListener('dblclick',e=>{ if(state.editMode==='content' && !selectedStudentName){ state.seats[k]=''; save(); render(); showMessage('已清除這格'); } });
      input.addEventListener('click',e=>{ if(state.editMode==='content' && selectedStudentName){ e.preventDefault(); e.stopPropagation(); assignStudentToSeat(selectedStudentName,k); } });
      input.addEventListener('input',e=>{ state.seats[k]=e.target.value; save(); if(!String(e.target.value||'').trim()) renderSeats(); }); input.addEventListener('change',()=>{ save(); render(); }); seat.appendChild(input); grid.appendChild(seat);
    }
  }
  function renderStudents(){
    const grid=$('studentGrid'); grid.innerHTML='';
    const used=new Set(Object.values(state.seats).map(v=>String(v||'').trim()).filter(Boolean));
    state.studentList.forEach((st,idx)=>{
      const row=document.createElement('div'); row.className='student'; if(used.has(st.name)) row.classList.add('assigned'); if(selectedStudentName===st.name) row.classList.add('selected-pick'); row.dataset.id=st.id;
      row.innerHTML=`<div class="student-main"><span class="no">${String(idx+1).padStart(2,'0')}</span><span class="student-name ${st.gender==='女'?'pink':'blue'}"></span><span class="tags"><span class="tag ${st.gender==='女'?'female':'male'}">${escapeHTML(st.gender)}</span><span class="tag ${st.school==='秀山'?'xiushan':(st.school==='秀朗'?'xiulang':'')}">${escapeHTML(st.school)}</span></span></div><div class="student-actions no-print"><button class="iconbtn edit">✎</button><button class="iconbtn del">🗑</button></div>`;
      row.querySelector('.student-name').textContent=st.name;
      row.querySelector('.student-main').addEventListener('click',()=>togglePickStudent(st.name));
      row.querySelector('.del').addEventListener('click',()=>{ if(confirm('刪除 '+st.name+'？')){ if(selectedStudentName===st.name) selectedStudentName=''; state.studentList=state.studentList.filter(s=>s.id!==st.id); save(); render(); showMessage('已刪除'); } });
      row.querySelector('.edit').addEventListener('click',()=>editStudent(row,st));
      grid.appendChild(row);
    });
    for(let i=0;i<Math.max(0,35-state.studentList.length);i++){
      const div=document.createElement('div'); div.className='empty-line'; div.innerHTML=`<span class="no">${String(state.studentList.length+i+1).padStart(2,'0')}</span><div class="empty-fill"></div>`; grid.appendChild(div);
    }
  }
  function editStudent(row,st){
    row.innerHTML=`<div class="student-main"><span class="no">✎</span><div class="edit-inline"><input class="edit-name"><select class="edit-gender"><option>女</option><option>男</option></select><select class="edit-school"><option>秀山</option><option>秀朗</option><option>其他</option></select></div></div><div class="student-actions no-print"><button class="iconbtn save">✓</button><button class="iconbtn cancel">×</button></div>`;
    row.querySelector('.edit-name').value=st.name; row.querySelector('.edit-gender').value=st.gender; row.querySelector('.edit-school').value=st.school;
    row.querySelector('.cancel').addEventListener('click',render);
    row.querySelector('.save').addEventListener('click',()=>{ const name=row.querySelector('.edit-name').value.trim(); if(!name){showMessage('姓名不能空白','error'); return;} const oldName=st.name; st.name=name; st.gender=row.querySelector('.edit-gender').value; st.school=row.querySelector('.edit-school').value; Object.keys(state.seats).forEach(k=>{ if(state.seats[k]===oldName) state.seats[k]=name; }); save(); render(); showMessage('更新完成'); });
  }
  function escapeHTML(s){ return String(s??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
  function render(){ ensureGrid(); renderControls(); renderSeats(); renderStudents(); }
  function setRows(n){ state.rows=safeNum(n,state.rows,1); save(); render(); }
  function setCols(n){ state.cols=safeNum(n,state.cols,1); save(); render(); }
  function addStudent(){ const name=$('newName').value.trim(); if(!name){ showMessage('請先輸入學生姓名','error'); return; } state.studentList.push({id:uid(), name, gender:$('newGender').value, school:$('newSchool').value}); $('newName').value=''; save(); render(); showMessage('已新增 '+name); }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function dateStamp(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function exportFileName(kind){
    const date=dateStamp();
    if(kind==='students') return '學生名單_'+date+'.json';
    if(kind==='config') return '座位佈置_'+date+'.json';
    return '智慧教室資料_'+date+'.json';
  }
  function exportJSON(data, filename){ const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); showMessage('已匯出 '+filename); }
  function readFile(input, cb){ const f=input.files && input.files[0]; if(!f) return; const reader=new FileReader(); reader.onload=e=>{ try{ cb(JSON.parse(e.target.result)); save(); render(); showMessage('載入完成'); }catch(err){ showMessage('檔案格式不對，請載入 json','error'); } input.value=''; }; reader.readAsText(f); }
  function availableSeatKeys(){ const arr=[]; for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){ const k=key(r,c); if(state.activeSeats[k] && !isInsideTeacherArea(r,c)) arr.push(k); } return arr; }

  $('clearBtn').addEventListener('click',()=>{ if(!confirm('確定要清空座位上的所有姓名嗎？')) return; Object.keys(state.seats).forEach(k=>state.seats[k]=''); selectedStudentName=''; state.editMode='content'; save(); render(); showMessage('座位已清空'); });
  $('printBtn').addEventListener('click',()=>{ const old=document.title; document.title='班級座位表'; const restore=()=>{document.title=old; window.removeEventListener('afterprint',restore);}; window.addEventListener('afterprint',restore); window.print(); });
  $('randomBtn').addEventListener('click',()=>{ if(state.studentList.length===0){showMessage('請先新增學生','error');return;} const seats=availableSeatKeys(); if(state.studentList.length>seats.length){showMessage('位置不足：學生 '+state.studentList.length+' 人，座位 '+seats.length+' 個','error');return;} seats.forEach(k=>state.seats[k]=''); selectedStudentName=''; const shuffled=[...state.studentList].sort(()=>Math.random()-.5); shuffled.forEach((s,i)=>state.seats[seats[i]]=s.name); state.editMode='content'; save(); render(); showMessage('隨機排位完成'); });
  $('rowMinus').addEventListener('click',()=>setRows(state.rows-1)); $('rowPlus').addEventListener('click',()=>setRows(state.rows+1)); $('colMinus').addEventListener('click',()=>setCols(state.cols-1)); $('colPlus').addEventListener('click',()=>setCols(state.cols+1));
  $('rows').addEventListener('change',e=>setRows(e.target.value)); $('cols').addEventListener('change',e=>setCols(e.target.value));
  $('layoutMode').addEventListener('click',()=>{state.editMode='layout'; save(); render();}); $('contentMode').addEventListener('click',()=>{state.editMode='content'; save(); render();});
  ['teacherRow','teacherCol','teacherRowSpan','teacherColSpan'].forEach(id=>$(id).addEventListener('change',()=>{ state.teacherConfig={...state.teacherConfig,row:safeNum($('teacherRow').value,0,0),col:safeNum($('teacherCol').value,0,0),rowSpan:safeNum($('teacherRowSpan').value,1,1),colSpan:safeNum($('teacherColSpan').value,1,1)}; save(); render(); }));
  $('teacherEnabled').addEventListener('change',e=>{state.teacherConfig.enabled=e.target.checked; save(); render();});
  $('addStudent').addEventListener('click',addStudent); $('newName').addEventListener('keydown',e=>{ if(e.key==='Enter') addStudent(); });
  $('exportStudents').addEventListener('click',()=>exportJSON(state.studentList,exportFileName('students')));
  $('exportConfig').addEventListener('click',()=>exportJSON(state,exportFileName('config')));
  $('importStudents').addEventListener('click',()=>$('studentFile').click()); $('importConfig').addEventListener('click',()=>$('configFile').click());
  $('studentFile').addEventListener('change',e=>readFile(e.target, data=>{ if(!Array.isArray(data)) throw Error('bad'); state.studentList=data.map(s=>({id:s.id||uid(), name:String(s.name||'').trim(), gender:s.gender||'女', school:s.school||'其他'})).filter(s=>s.name); }));
  $('configFile').addEventListener('change',e=>readFile(e.target, data=>{ state={...state,...data}; ensureGrid(); }));

  load(); render();
})();
</script>


  <script>
    window.MITU_APP_VERSION = 'v2026.04.30-62';

    async function mituClearOldCaches() {
      if (!('caches' in window)) return;
      const keep = 'mitu-seat-v2026.04.30-62';
      const keys = await caches.keys();
      await Promise.all(keys.map(function (key) {
        if (key.indexOf('mitu-seat-') === 0 && key !== keep) {
          return caches.delete(key);
        }
      }));
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async function () {
        try {
          await mituClearOldCaches();
          const registration = await navigator.serviceWorker.register('./sw.js?v=60', {
            scope: './',
            updateViaCache: 'none'
          });

          await registration.update();

          if (registration.waiting) {
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
          }

          registration.addEventListener('updatefound', function () {
            const worker = registration.installing;
            if (!worker) return;
            worker.addEventListener('statechange', function () {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                worker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });

          let refreshed = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (refreshed) return;
            refreshed = true;
            const key = 'mitu-reloaded-v2026.04.30-62';
            if (!sessionStorage.getItem(key)) {
              sessionStorage.setItem(key, '1');
              window.location.replace('./index.html?v=60');
            }
          });
        } catch (err) {
          console.warn('Service worker registration failed:', err);
        }
      });
    }
  </script>
