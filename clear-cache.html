<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>米兔座位系統｜清除快取</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 32px; background: #f8fafc; color: #111827; }
    .card { max-width: 560px; margin: 0 auto; background: white; border-radius: 20px; padding: 24px; box-shadow: 0 12px 32px rgba(15,23,42,.12); }
    h1 { margin-top: 0; font-size: 24px; }
    button, a { display: inline-block; margin-top: 12px; padding: 12px 16px; border-radius: 12px; border: 0; background: #6366f1; color: white; text-decoration: none; font-weight: 700; }
    #status { white-space: pre-line; line-height: 1.7; color: #374151; }
  </style>
</head>
<body>
  <div class="card">
    <h1>米兔座位系統快取更新</h1>
    <p id="status">正在清除舊版 PWA 快取……</p>
    <a id="open" href="./index.html?v=60" style="display:none">開啟新版</a>
  </div>
  <script>
    async function clearEverything() {
      const lines = [];
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) { await reg.unregister(); }
          lines.push('已移除舊 service worker：' + regs.length + ' 個');
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
          lines.push('已清除舊快取：' + keys.length + ' 個');
        }
        lines.push('完成。即將開啟 v2026.04.30-60。');
        document.getElementById('status').textContent = lines.join('
');
        document.getElementById('open').style.display = 'inline-block';
        setTimeout(function () { window.location.replace('./index.html?v=60'); }, 1200);
      } catch (err) {
        document.getElementById('status').textContent = '清除時發生錯誤：' + err + '
請按下方按鈕開啟新版。';
        document.getElementById('open').style.display = 'inline-block';
      }
    }
    clearEverything();
  </script>
</body>
</html>
